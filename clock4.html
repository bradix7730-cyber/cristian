
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cristian Revera - Countdown Timer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                to bottom,
                #70c5ff,
                #c8edff,
                #f0fbff
            );
        }

        /* Animated sky */
        .sky {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .sun {
            position: absolute;
            top: 8%;
            right: 12%;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #ffe680;
            box-shadow: 0 0 45px #fff2a8;
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 25px #fff2a8;
            }
            to {
                box-shadow: 0 0 60px #fff2a8;
            }
        }

        /* Flying birds */
        .bird {
            position: absolute;
            left: -100px;
            font-size: 35px;
            animation: fly 12s linear infinite;
        }

        .bird1 {
            top: 15%;
            animation-duration: 12s;
        }

        .bird2 {
            top: 28%;
            font-size: 25px;
            animation-duration: 16s;
            animation-delay: 2s;
        }

        .bird3 {
            top: 40%;
            font-size: 42px;
            animation-duration: 19s;
            animation-delay: 4s;
        }

        .bird4 {
            top: 65%;
            font-size: 28px;
            animation-duration: 14s;
            animation-delay: 1s;
        }

        @keyframes fly {
            0% {
                left: -100px;
                transform: translateY(0) rotate(-5deg);
            }
            25% {
                transform: translateY(-25px) rotate(5deg);
            }
            50% {
                transform: translateY(10px) rotate(-5deg);
            }
            75% {
                transform: translateY(-20px) rotate(5deg);
            }
            100% {
                left: 110%;
                transform: translateY(0) rotate(-5deg);
            }
        }

        /* Timer card */
        .container {
            position: relative;
            z-index: 2;
            width: min(90%, 430px);
            padding: 35px 25px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            box-shadow: 0 15px 40px rgba(28, 92, 140, 0.2);
        }

        .name {
            color: #1474a8;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        h1 {
            color: #174b70;
            font-size: 30px;
            margin-bottom: 22px;
        }

        .bird-icon {
            display: inline-block;
            animation: flap 0.7s ease-in-out infinite alternate;
        }

        @keyframes flap {
            from {
                transform: rotate(-12deg) translateY(0);
            }
            to {
                transform: rotate(12deg) translateY(-5px);
            }
        }

        #countdown {
            padding: 25px 10px;
            border-radius: 15px;
            background: #e8f7ff;
            border: 2px solid #b5e4fa;
            color: #075985;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        #datetime {
            color: #53758b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
            opacity: 0.85;
        }

        button:active {
            transform: scale(0.96);
        }

        #playBtn {
            background: #28a66a;
        }

        #pauseBtn {
            background: #e6a23c;
        }

        #resetBtn {
            background: #e45c5c;
        }

        #status {
            margin-top: 22px;
            color: #28749a;
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .footer {
            margin-top: 18px;
            color: #66899e;
            font-size: 14px;
        }

        @media (max-width: 380px) {
            .container {
                padding: 28px 15px;
            }

            .name {
                font-size: 23px;
            }

            h1 {
                font-size: 25px;
            }

            #countdown {
                font-size: 23px;
            }

            button {
                padding: 11px 13px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <div class="sky" aria-hidden="true">
        <div class="sun"></div>
        <div class="bird bird1">🐦</div>
        <div class="bird bird2">🐦</div>
        <div class="bird bird3">🕊️</div>
        <div class="bird bird4">🐦</div>
    </div>

    <main class="container">
        <p class="name">✦ Cristian Revera ✦</p>

        <h1><span class="bird-icon">🐦</span> Countdown Timer</h1>

        <p id="countdown" aria-live="off">
            Time remaining: 60 seconds
        </p>

        <p id="datetime"></p>

        <div class="buttons">
            <button id="playBtn" type="button">▶ Play</button>
            <button id="pauseBtn" type="button">⏸ Pause</button>
            <button id="resetBtn" type="button">↻ Reset</button>
        </div>

        <p id="status" role="status">READY</p>

        <p class="footer">~ Fly high and make every second count! ~</p>
    </main>

    <script>
        const START_TIME = 60;

        let secondsLeft = START_TIME;
        let timer = null;
        let endTime = null;

        const countdownDisplay = document.getElementById("countdown");
        const datetimeDisplay = document.getElementById("datetime");
        const statusDisplay = document.getElementById("status");
        const playBtn = document.getElementById("playBtn");
        const pauseBtn = document.getElementById("pauseBtn");

        function showDateTime() {
            datetimeDisplay.textContent = new Date().toLocaleString();
        }

        function updateCountdown() {
            countdownDisplay.textContent =
                `Time remaining: ${secondsLeft} second${secondsLeft === 1 ? "" : "s"}`;
        }

        function updateButtons() {
            playBtn.disabled = timer !== null || secondsLeft <= 0;
            pauseBtn.disabled = timer === null;
        }

        function stopTimer() {
            if (timer !== null) {
                clearInterval(timer);
                timer = null;
            }
        }

        function tick() {
            secondsLeft = Math.max(
                0,
                Math.ceil((endTime - Date.now()) / 1000)
            );

            if (secondsLeft <= 0) {
                stopTimer();
                endTime = null;
                countdownDisplay.textContent = "🎉 Time is up!";
                statusDisplay.textContent = "COMPLETED";
                updateButtons();
                return;
            }

            updateCountdown();
        }

        function playCountdown() {
            if (timer !== null || secondsLeft <= 0) {
                return;
            }

            endTime = Date.now() + secondsLeft * 1000;
            statusDisplay.textContent = "RUNNING";

            timer = setInterval(tick, 200);
            updateButtons();
            tick();
        }

        function pauseCountdown() {
            if (timer === null) {
                return;
            }

            tick();

            if (secondsLeft <= 0) {
                return;
            }

            stopTimer();
            endTime = null;
            statusDisplay.textContent = "PAUSED";
            updateButtons();
        }

        function resetCountdown() {
            stopTimer();
            endTime = null;
            secondsLeft = START_TIME;

            updateCountdown();
            statusDisplay.textContent = "READY";
            updateButtons();
        }

        playBtn.addEventListener("click", playCountdown);
        pauseBtn.addEventListener("click", pauseCountdown);
        document.getElementById("resetBtn")
            .addEventListener("click", resetCountdown);

        showDateTime();
        setInterval(showDateTime, 1000);

        updateCountdown();
        updateButtons();
    </script>

</body>
</html>
